name: CI-Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependecies and Run Tests
        run: |
          npm install
          npm test || echo "No tests defined yet, but the step is ready"
      - name: Build Docker image
        run: docker build -t project:test .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'project:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
